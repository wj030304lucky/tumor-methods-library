<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文献详情｜肿瘤研究方法学文献库</title><link rel="stylesheet" href="styles.css"></head><body class="detail-page">
<header class="hero"><div class="hero-inner"><div><a class="back-link" href="index.html">← 返回文献库</a><div class="eyebrow">Paper Methodology Deep Dive</div><h1>单篇文献方法学拆解</h1><p class="subtitle">从“这篇用了什么方法”继续追到“为什么用、依赖什么假设、怎么判断做对了、以后怎么复现”。</p></div></div></header>
<main class="detail-shell"><div id="detail"></div></main><script src="data.js"></script><script>
const STORE='tumorMethodLibraryStateV1';let state=JSON.parse(localStorage.getItem(STORE)||'{}');const sid=id=>state[id]||{status:'unread',favorite:false,note:'',checks:{}};const save=()=>localStorage.setItem(STORE,JSON.stringify(state));const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const list=a=>(a||[]).map(v=>`<li>${esc(v)}</li>`).join('');const id=new URLSearchParams(location.search).get('id');const p=PAPERS.find(x=>x.id===id);const root=document.getElementById('detail');
if(!p){root.innerHTML='<div class="detail-card not-found"><h2>未找到这篇文献</h2><p><a href="index.html">返回文献库</a></p></div>'}else{document.title=p.id+' '+p.title+'｜肿瘤方法学文献库';const i=PAPERS.indexOf(p),prev=PAPERS[i-1],next=PAPERS[i+1],x=sid(id),d=getDeepDive(p);const checks=x.checks||{};root.innerHTML=`<article class="detail-card"><div class="paper-id">${p.id} · ${esc(p.module)}</div><h2 class="detail-title">${esc(p.title)}</h2><div class="detail-meta">${esc(p.authors)}<br>${esc(p.journal)} · ${p.year}<br><span class="stars">${'★'.repeat(p.priority)}${'☆'.repeat(5-p.priority)}</span></div><div class="tags">${p.methods.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
<div class="paper-actions"><select id="status" style="width:auto"><option value="unread" ${x.status==='unread'?'selected':''}>未读</option><option value="reading" ${x.status==='reading'?'selected':''}>在读</option><option value="done" ${x.status==='done'?'selected':''}>已读</option></select><button id="fav" class="btn ghost favorite-btn ${x.favorite?'active':''}">${x.favorite?'★ 已收藏':'☆ 收藏'}</button><a class="btn" href="${p.url}" target="_blank" rel="noopener" style="text-decoration:none">打开原文</a></div>
<nav class="detail-toc"><a href="#basic">研究概况</a><a href="#method">方法核心</a><a href="#assumption">假设与诊断</a><a href="#reproduce">复现与延伸</a><a href="#noteSec">学习笔记</a></nav>
<section id="basic" class="detail-section"><h3>1. 研究问题</h3><p>${esc(p.question)}</p></section>
<section class="detail-section"><h3>2. 数据来源与样本</h3><div class="info-grid"><div><span>数据</span><strong>${esc(p.data)}</strong></div><div><span>样本</span><strong>${esc(p.sample)}</strong></div><div><span>研究设计</span><strong>${esc(p.design)}</strong></div><div><span>核心方法</span><strong>${esc(p.methods.join(' · '))}</strong></div></div></section>
<section class="detail-section"><h3>3. 统计方法完整流程</h3><div class="flow">${esc(p.flow)}</div></section>
<section id="method" class="detail-section deep-block"><h3>4. 为什么这里要用这个方法？</h3><p>${esc(d.why)}</p><div class="method-callout"><b>核心 estimand / 参数：</b> ${esc(d.estimand)}</div></section>
<section class="detail-section"><h3>5. 建模时真正需要哪些变量？</h3><ul class="deep-list">${list(d.variables)}</ul><p class="small-tip">这里列的是理解/复现该类方法时应准备的数据结构，不等同于原文逐项变量清单。</p></section>
<section id="assumption" class="detail-section"><h3>6. 关键识别假设 / 模型假设</h3><ul class="deep-list warning-list">${list(d.assumptions)}</ul></section>
<section class="detail-section"><h3>7. 怎么判断模型“做对了”？</h3><ul class="deep-list">${list(d.diagnostics)}</ul></section>
<section class="detail-section"><h3>8. 核心结果 / 方法结论</h3><p>${esc(p.result)}</p></section>
<section class="detail-section"><h3>9. 方法学创新点</h3><p>${esc(p.innovation)}</p></section>
<section class="detail-section"><h3>10. 局限性</h3><p>${esc(p.limitations)}</p></section>
<section id="reproduce" class="detail-section"><h3>11. 如果我要自己复现</h3><ul class="deep-list">${list(d.replication)}</ul></section>
<section class="detail-section"><h3>12. 读这篇时最应该盯住什么？</h3><div class="reading-focus">${esc(d.reading)}</div>${d.extensions?`<p><strong>进一步延伸：</strong>${esc(d.extensions)}</p>`:''}</section>
<section class="detail-section"><h3>13. 对以后课题的启示</h3><p>${esc(p.reuse)}</p></section>
<section class="detail-section mastery-box"><h3>14. 我是否真正掌握了？</h3><label><input class="master-check" data-k="q" type="checkbox" ${checks.q?'checked':''}> 我能用一句话说清楚这篇的研究问题</label><label><input class="master-check" data-k="m" type="checkbox" ${checks.m?'checked':''}> 我知道为什么这里要用这个方法，而不是普通回归</label><label><input class="master-check" data-k="a" type="checkbox" ${checks.a?'checked':''}> 我知道这个方法最关键的假设和偏倚来源</label><label><input class="master-check" data-k="r" type="checkbox" ${checks.r?'checked':''}> 我能说出一个可以迁移到自己课题的研究问题</label></section>
<section id="noteSec" class="detail-section note-box"><h3>15. 我的学习笔记</h3><textarea id="note" placeholder="建议记录：①一句话概括；②最值得学的方法；③仍不懂的地方；④能否换成肺癌/肝癌/SEER/医院随访数据；⑤需要哪些变量。">${esc(x.note)}</textarea><p><button id="saveNote" class="btn">保存笔记</button></p></section>
<div class="nav-papers">${prev?`<a class="btn ghost" href="detail.html?id=${prev.id}">← ${prev.id} ${esc(prev.title.slice(0,34))}</a>`:'<span></span>'}${next?`<a class="btn ghost" href="detail.html?id=${next.id}">${next.id} ${esc(next.title.slice(0,34))} →</a>`:''}</div></article>`;
document.getElementById('status').onchange=e=>{state[id]={...sid(id),status:e.target.value};save()};document.getElementById('fav').onclick=e=>{const v=!sid(id).favorite;state[id]={...sid(id),favorite:v};save();e.target.textContent=v?'★ 已收藏':'☆ 收藏';e.target.classList.toggle('active',v)};document.getElementById('saveNote').onclick=()=>{state[id]={...sid(id),note:document.getElementById('note').value};save();const b=document.getElementById('saveNote');b.textContent='已保存';setTimeout(()=>b.textContent='保存笔记',1000)};document.querySelectorAll('.master-check').forEach(el=>el.onchange=()=>{const cur=sid(id);const c={...(cur.checks||{}),[el.dataset.k]:el.checked};state[id]={...cur,checks:c};save()});}
</script></body></html>
