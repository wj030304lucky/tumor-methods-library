<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文献详情｜肿瘤研究方法学文献库</title><link rel="stylesheet" href="styles.css"></head><body class="detail-page">
<header class="hero"><div class="hero-inner"><div><a class="back-link" href="index.html">← 返回文献库</a><div class="eyebrow">Paper Methodology Detail</div><h1>单篇文献方法学拆解</h1><p class="detail-version">肿瘤方法学文献更新 <span id="detailVersion"></span></p></div></div></header><main class="detail-shell"><div id="detail"></div></main><script src="data.js"></script><script>
const STORE='tumorMethodLibraryStateV1';let state=JSON.parse(localStorage.getItem(STORE)||'{}');const sid=id=>state[id]||{status:'unread',favorite:false,note:''};const save=()=>localStorage.setItem(STORE,JSON.stringify(state));const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const id=new URLSearchParams(location.search).get('id');const p=PAPERS.find(x=>x.id===id);const root=document.getElementById('detail');
document.getElementById('detailVersion').textContent=`${LIB_META.version} · ${LIB_META.updated}`;
if(!p){root.innerHTML='<div class="detail-card not-found"><h2>未找到这篇文献</h2><p>链接可能已失效，或文献编号已在新版中调整。</p><p><a class="btn" href="index.html">返回文献库</a></p></div>'}else{document.title=p.id+' '+p.title+'｜肿瘤方法学文献库';const i=PAPERS.indexOf(p),prev=PAPERS[i-1],next=PAPERS[i+1],x=sid(id);root.innerHTML=`<article class="detail-card"><div class="detail-kicker"><span class="paper-id">${p.id}</span><span>${esc(p.module)}</span><span>${i+1} / ${PAPERS.length}</span></div><h2 class="detail-title">${esc(p.title)}</h2><div class="detail-meta"><strong>${esc(p.authors)}</strong><br>${esc(p.journal)} · ${p.year}<br><span class="stars" aria-label="推荐级别 ${p.priority} 星">${'★'.repeat(p.priority)}${'☆'.repeat(5-p.priority)}</span></div><div class="tags">${p.methods.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
<div class="paper-actions"><label class="status-control"><span>学习状态</span><select id="status"><option value="unread" ${x.status==='unread'?'selected':''}>未读</option><option value="reading" ${x.status==='reading'?'selected':''}>在读</option><option value="done" ${x.status==='done'?'selected':''}>已读</option></select></label><button id="fav" class="btn ghost favorite-btn ${x.favorite?'active':''}">${x.favorite?'★ 已收藏':'☆ 收藏'}</button><button id="copyCitation" class="btn ghost">复制引用</button><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">打开原文 ↗</a></div>
<section class="detail-section"><h3>1. 研究问题</h3><p>${esc(p.question)}</p></section>
<section class="detail-section"><h3>2. 数据来源与样本</h3><p><strong>数据：</strong>${esc(p.data)}</p><p><strong>样本：</strong>${esc(p.sample)}</p><p><strong>研究设计：</strong>${esc(p.design)}</p></section>
<section class="detail-section"><h3>3. 统计方法完整流程</h3><div class="flow">${esc(p.flow)}</div></section>
<section class="detail-section"><h3>4. 核心结果 / 方法结论</h3><p>${esc(p.result)}</p></section>
<section class="detail-section"><h3>5. 方法学创新点</h3><p>${esc(p.innovation)}</p></section>
<section class="detail-section"><h3>6. 局限性</h3><p>${esc(p.limitations)}</p></section>
<section class="detail-section"><h3>7. 对以后课题的启示</h3><p>${esc(p.reuse)}</p></section>
<section class="detail-section note-box"><h3>8. 我的学习笔记</h3><textarea id="note" placeholder="例如：这个方法能否用于肺癌？能否换成SEER/医院随访数据？需要哪些变量？">${esc(x.note)}</textarea><p><button id="saveNote" class="btn">保存笔记</button></p></section>
<div class="nav-papers">${prev?`<a class="btn ghost" href="detail.html?id=${prev.id}">← ${prev.id} ${esc(prev.title.slice(0,34))}</a>`:'<span></span>'}${next?`<a class="btn ghost" href="detail.html?id=${next.id}">${next.id} ${esc(next.title.slice(0,34))} →</a>`:''}</div></article>`;
document.getElementById('status').onchange=e=>{state[id]={...sid(id),status:e.target.value};save()};document.getElementById('fav').onclick=e=>{const v=!sid(id).favorite;state[id]={...sid(id),favorite:v};save();e.target.textContent=v?'★ 已收藏':'☆ 收藏';e.target.classList.toggle('active',v)};document.getElementById('copyCitation').onclick=async e=>{const citation=`${p.authors} (${p.year}). ${p.title}. ${p.journal}. ${p.url}`;try{await navigator.clipboard.writeText(citation);e.target.textContent='已复制'}catch{window.prompt('复制文献引用：',citation)}setTimeout(()=>e.target.textContent='复制引用',1200)};document.getElementById('saveNote').onclick=()=>{state[id]={...sid(id),note:document.getElementById('note').value};save();const b=document.getElementById('saveNote');b.textContent='已保存';setTimeout(()=>b.textContent='保存笔记',1000)};}
</script></body></html>
